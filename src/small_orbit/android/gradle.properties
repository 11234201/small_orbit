org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:ActiveProcessorCount=8
org.gradle.workers.max=4
android.useAndroidX=true
# Sideload distributions share one version sequence. ABI-only packages must be
# interchangeable with the universal package without Android treating it as a downgrade.
force-version-code-ignoring-abi=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
